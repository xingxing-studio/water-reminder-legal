name: Publish official legal and support pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy/**
      - terms/**
      - support/**
      - .nojekyll
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public legal-page source
        uses: actions/checkout@v4
      - name: Prepare only approved public HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/privacy _site/terms _site/support
          cp index.html _site/index.html
          cp privacy/index.html _site/privacy/index.html
          cp terms/index.html _site/terms/index.html
          cp support/index.html _site/support/index.html
          touch _site/.nojekyll
          for f in _site/index.html _site/privacy/index.html _site/terms/index.html _site/support/index.html; do
            test -s "$f"
            if grep -Eq 'PLACEHOLDER|TODO|<!--' "$f"; then echo "Unresolved legal-page placeholder"; exit 1; fi
          done
          grep -q '/water-reminder-legal/privacy/' _site/index.html
          grep -q 'mailto:1039672710@qq.com' _site/support/index.html
          echo "LEGAL_PUBLIC_PAGES=VALIDATED"
      - name: Enable Pages (if not already enabled)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload approved static pages only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public HTTPS site
        id: deployment
        uses: actions/deploy-pages@v4
